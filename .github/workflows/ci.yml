name: CI

on:
  push:
    branches: [main]
  pull_request:
    # There is deliberately NO `branches:` filter here. A `branches:` filter on
    # pull_request matches the PR's BASE branch, so `branches: [main]` runs ZERO
    # gating jobs on a stacked PR — not a narrower run, no run at all, and the
    # pull request then shows a green page with no checks on it. Every gating
    # lane must trigger on any base branch; `paths`/`paths-ignore` remain the
    # only intended narrowing.
    #
    # `ready_for_review` is listed so a PR opened as a draft — whose gating jobs
    # were skipped — revalidates the moment it is marked ready, instead of
    # waiting for the next push that may never come.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# There is deliberately no `schedule:` here. This file has no paths filtering, so
# every job already runs on every push and every pull request: a nightly run
# would repeat the same work and add no signal.
# capability:start codex_cloud
# The nightly lane that genuinely covers something else — real network, real
# registries — is .github/workflows/codex-cloud-smoke.yml.
# capability:end codex_cloud

# Cancel superseded runs on the same ref, but keep draft and ready runs in
# separate lanes. Without the suffix a ready_for_review run cancels the draft run
# it supersedes, and the cancelled draft jobs stay attached to the exact head
# commit — so the head remains red after every ready-state job has passed.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

permissions:
  contents: read

# The single Bun authority for this file. The chain is deliberately one-way:
# .prototools -> env.BUN_VERSION -> the setup-bun action's required input ->
# oven-sh/setup-bun -> a runtime assertion back against .prototools. No job may
# spell a Bun version any other way; the toolchain guard rejects it if one does.
env:
  BUN_VERSION: "1.3.13"

jobs:
  # Draft pull requests skip the gating jobs; the aggregate gate refuses to go
  # green while a PR is a draft, so a skipped lane can never be mistaken for a
  # validated one.
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the sealed-evidence guards re-check ancestry with
          # `git merge-base --is-ancestor`, which a shallow clone cannot answer.
          # This is the only job that declares ownership of repository history;
          # no other job may set fetch-depth.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate toolchain contract
        run: bun run toolchain:check

      - name: Validate image contract
        run: bun run image:check

      # capability:start playwright
      - name: Validate browser runtime contract
        run: bun run browser:check
      # capability:end playwright

      # capability:start codex_cloud
      - name: Validate Codex Cloud contract
        run: bun run cloud:check

      - name: Run hermetic Codex Cloud bootstrap selftest
        run: bash .codex/cloud/selftest.sh
      # capability:end codex_cloud

      - name: Validate worktree runtime contract
        run: bun run worktree:check

      - name: Run hermetic worktree runtime selftest
        run: bash scripts/worktree/selftest.sh

      - name: Lint
        run: bunx biome check --no-errors-on-unmatched .

      - name: Typecheck
        run: bun tsc --noEmit
        continue-on-error: true # remove once tsconfig is fully wired up

      - name: Test
        run: bun test
        continue-on-error: true # no tests in template; downstream projects should remove this flag

      # template-only:start stage-zero-baseline
      - name: Validate template baseline contract
        run: |
          bun run template:validate
          bun run template:test
          bun run template:typecheck
          bun run template:fixtures "${RUNNER_TEMP}/template-fixtures"
      # template-only:end stage-zero-baseline

  image:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build selected image target
        run: |
          target="$(jq -r '.build.target' .devcontainer/devcontainer.json)"
          docker build --progress=plain --target "$target" -f .devcontainer/Dockerfile .

  # capability:start playwright
  browser:
    name: Launch baked browser payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare browser-enabled project
        shell: bash
        run: |
          set -euo pipefail
          project="$PWD"
          if [ -f template-parameters.toml ]; then
            bun run template:fixtures "${RUNNER_TEMP}/template-fixtures"
            project="${RUNNER_TEMP}/template-fixtures/full"
            cd "$project"
            bash "${GITHUB_WORKSPACE}/scripts/ci/bun-install-retry.sh"
          fi
          printf '%s\n' "$project" > "${RUNNER_TEMP}/browser-project"

      - name: Build and launch browser profile
        shell: bash
        run: |
          set -euo pipefail
          project="$(cat "${RUNNER_TEMP}/browser-project")"
          docker build \
            --progress=plain \
            --target development_browser \
            --tag devenv-browser-ci \
            --file "$project/.devcontainer/Dockerfile" \
            "$project"
          docker run --rm \
            --volume "$project:/workspace:ro" \
            --workdir /workspace \
            devenv-browser-ci \
            bun run browser:preflight
  # capability:end playwright
