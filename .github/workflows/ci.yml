name: CI

on:
  push:
    branches: [main]
  pull_request:
    # There is deliberately NO `branches:` filter here. A `branches:` filter on
    # pull_request matches the PR's BASE branch, so `branches: [main]` runs ZERO
    # gating jobs on a stacked PR — not a narrower run, no run at all, and the
    # pull request then shows a green page with no checks on it. Every gating
    # lane must trigger on any base branch; `paths`/`paths-ignore` remain the
    # only intended narrowing.
    #
    # `ready_for_review` is listed so a PR opened as a draft — whose gating jobs
    # were skipped — revalidates the moment it is marked ready, instead of
    # waiting for the next push that may never come.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# There is deliberately no `schedule:` here. This file has no paths filtering, so
# every job already runs on every push and every pull request: a nightly run
# would repeat the same work and add no signal.
# capability:start codex_cloud
# The nightly lane that genuinely covers something else — real network, real
# registries — is .github/workflows/codex-cloud-smoke.yml.
# capability:end codex_cloud

# Cancel superseded runs on the same ref, but keep draft and ready runs in
# separate lanes. Without the suffix a ready_for_review run cancels the draft run
# it supersedes, and the cancelled draft jobs stay attached to the exact head
# commit — so the head remains red after every ready-state job has passed.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

permissions:
  contents: read

# The single Bun authority for this file. The chain is deliberately one-way:
# .prototools -> env.BUN_VERSION -> the setup-bun action's required input ->
# oven-sh/setup-bun -> a runtime assertion back against .prototools. No job may
# spell a Bun version any other way; the toolchain guard rejects it if one does.
env:
  BUN_VERSION: "1.3.13"
  # capability:start moon_affected_selection
  # The single rollback switch for affected selection, and the only part of this
  # stage that lives outside the tree. Unset — which is how it ships — this is
  # `full`, the all-or-nothing behaviour that predates the capability, so a
  # rollback is a variable change with no deploy. The quoted fallback is asserted
  # against `[ci] affected_mode_initial` in template-parameters.toml, so the
  # out-of-tree override cannot drift from what this repository recorded.
  MOON_AFFECTED_MODE: ${{ vars.MOON_AFFECTED_MODE || 'full' }}
  # capability:end moon_affected_selection

jobs:
  # Draft pull requests skip the gating jobs; the aggregate gate refuses to go
  # green while a PR is a draft, so a skipped lane can never be mistaken for a
  # validated one.
  ci:
    name: Contracts & Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the sealed-evidence guards re-check ancestry with
          # `git merge-base --is-ancestor`, which a shallow clone cannot answer.
          # This is the only job that declares ownership of repository history;
          # no other job may set fetch-depth.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate workflow policy contract
        run: bun run ci:check

      - name: Validate toolchain contract
        run: bun run toolchain:check

      - name: Validate image contract
        run: bun run image:check

      # capability:start moon_affected_selection
      # The hermetic leg only. It rebuilds the project graph from the manifests
      # and the sources, so it needs no moon binary and belongs in the lane that
      # already has Bun. The live leg — reconciling that graph with what moon
      # itself reports — needs a real toolchain and runs in the moon-graph job.
      - name: Validate moon project graph
        run: bun run graph:check

      # The selection guard's static half: guard wiring, the universe registry,
      # template ownership, and the recorded initial mode. It needs neither moon
      # nor a pull request's history, so it belongs beside the graph's hermetic
      # leg rather than in the lane that computes a selection.
      - name: Validate affected selection contract
        run: bun run affected:check
      # capability:end moon_affected_selection

      # capability:start playwright
      - name: Validate browser runtime contract
        run: bun run browser:check
      # capability:end playwright

      # capability:start codex_cloud
      - name: Validate Codex Cloud contract
        run: bun run cloud:check

      - name: Run hermetic Codex Cloud bootstrap selftest
        run: bash .codex/cloud/selftest.sh
      # capability:end codex_cloud

      # capability:start openspec
      # Unconditional on purpose, and in THIS job on purpose. `openspec/**`
      # classifies as documentation in the affected-selection oracle, so a
      # lifecycle guard placed in a lane a selection can narrow would be skipped
      # by exactly the pull requests that change a change. The step is a fixed
      # cost that does not scale with the project graph, which is what makes the
      # `ci` job its correct home.
      - name: Validate OpenSpec lifecycle contract
        run: bun run openspec:check
      # capability:end openspec

      # capability:start rhf_zod
      # Unconditional, and in THIS job for the same reason the lifecycle guard
      # above is. The shared schema and API contract guard is a fixed cost that
      # does not scale with the project graph, and a contract gate living in a
      # lane a selection can narrow would be skipped by exactly the pull
      # requests that change a contract. There is deliberately NO new job: every
      # sealed evidence record's run-shape assertions are anchored on the gate's
      # own `needs`, and a stage that adds no lane cannot re-open that wound.
      - name: Validate shared schema and API contract
        run: bun run forms:check
      # capability:end rhf_zod

      # Ungated. Every project has agent rule files and a canonical AGENTS.md,
      # whatever else it disables, and the guard checks the mirrors only for
      # blocks the canonical file still declares — so a project that fenced a
      # capability away loses the canonical block and its mirrors together and
      # this step stays true without a second fence.
      - name: Validate canonical agent rules
        run: bun run rules:check

      - name: Validate worktree runtime contract
        run: bun run worktree:check

      - name: Run hermetic worktree runtime selftest
        run: bash scripts/worktree/selftest.sh

      # Lint, Typecheck and Test are NOT here. They are the three steps whose
      # cost scales with the project graph, so they live in the `project` job
      # below and run once per selected project. Everything this job still does
      # is a contract guard whose cost is fixed, which is why it stays
      # unconditional and is never selected against.

      # template-only:start stage-zero-baseline
      # `template:test` is deliberately absent: the Test step above already runs
      # the same suite through the wrapper, and listing it here ran it twice.
      - name: Validate template baseline contract
        run: |
          bun run template:validate
          bun run template:typecheck
          bun run template:fixtures "${RUNNER_TEMP}/template-fixtures"
      # template-only:end stage-zero-baseline

  image:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build selected image target
        run: |
          target="$(jq -r '.build.target' .devcontainer/devcontainer.json)"
          docker build --progress=plain --target "$target" -f .devcontainer/Dockerfile .

  # ── Selection ───────────────────────────────────────────────────────────
  # Decide which projects the heavy lane runs over. SELECTION ONLY: the
  # `project` job below still runs Biome, the compiler and the suite itself;
  # this job only decides which matrix entries exist.
  #
  # The job is CORE while its selector step is fenced, and that split is
  # deliberate. A project without the affected-selection capability receives no
  # selector, so this job emits no outputs and the matrix below falls back to a
  # single entry — which is exactly what the heavy lane did before the
  # capability existed. Fencing the whole job instead would leave such a project
  # with no lint, no compiler and no suite at all, which is the failure this
  # program exists to prevent.
  #
  # INVARIANT: this job stays in `ci-gate.needs` and must never be
  # `continue-on-error`. If it fails, `project` skips on the failed dependency
  # but the failure propagates to the gate, so a selector outage can never let a
  # pull request merge untested.
  affected:
    name: Select affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      ci: ${{ steps.select.outputs.ci }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the selection diffs from the pull request's true merge
          # base, and a shallow clone cannot answer what that is. The reason is
          # recorded in the workflow guard's HISTORY_OWNERS list.
          fetch-depth: 0

      # capability:start moon_affected_selection
      # Moon is installed only where it is used. Every event that is not a pull
      # request short-circuits to the full matrix before the binary is touched,
      # and so does the unflipped mode. A failure HERE fails the job and
      # therefore the gate — that is fail-closed and noisy, which is the correct
      # direction; only a failed QUERY falls open to the full matrix.
      - uses: ./.github/actions/setup-moon
        if: ${{ env.MOON_AFFECTED_MODE == 'moon' && github.event_name == 'pull_request' }}

      # `install: "false"` because the selector is a standalone script over
      # node: and Bun builtins — it imports nothing from node_modules.
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      # Every input arrives through `env:` and never through interpolation into
      # the body: pull-request metadata is attacker-influenced text, and spliced
      # into a shell command it becomes part of the script the runner executes.
      - name: Select affected projects
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/affected-matrices.sh
      # capability:end moon_affected_selection

  # ── The heavy lane ──────────────────────────────────────────────────────
  # The three steps whose cost scales with the project graph, run once per
  # selected project. An EMPTY matrix skips this job, which the aggregate gate
  # reads as `skipped` and treats as a pass — that is the point of the selection
  # and the reason the `affected` job above is a hard gate dependency.
  #
  # `needs.affected.outputs.ci` is empty in a project whose render carries no
  # selector, and the `|| ` fallback then produces the single entry this lane
  # always had. The matrix value is a label rather than a scope: these commands
  # are repository-wide, so one entry runs them once.
  project:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [affected]
    if: ${{ !github.event.pull_request.draft && needs.affected.outputs.ci != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.affected.outputs.ci || '["repository"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The suite this job runs is not only unit tests: the
          # sealed-evidence guards re-check ancestry with
          # `git merge-base --is-ancestor` and the rollback fixtures build
          # synthetic merges, and a shallow clone can answer neither. This came
          # out of a real run — the steps moved here from the `ci` job, which
          # had always had full history, and the evidence tests went red the
          # first time they ran without it. The reason is recorded in the
          # workflow guard's HISTORY_OWNERS list.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Lint
        run: bunx biome check --no-errors-on-unmatched .

      # No continue-on-error anywhere in this job. A step allowed to fail is a
      # step nobody reads: it reports green while reporting nothing. The two
      # reasons this file used to need one are gone — the compiler now has a
      # committed project to check (tsconfig.json), and the "no tests yet" case
      # is classified inside run-tests.sh instead of being waved through.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bash scripts/ci/run-tests.sh

  # capability:start moon_affected_selection
  # The live leg of the graph oracle. It is a separate job because it is the one
  # check here that needs a real toolchain: the `ci` job's fenced graph:check
  # step covers the hermetic leg with nothing but Bun, and folding the live leg
  # into it would make every contract check wait on a moon install.
  moon-graph:
    name: Verify Moon project graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}

    steps:
      # No fetch-depth: this job asks moon what the graph is, which is a
      # question about the checked-out tree and not about its ancestry.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-moon

      # `install: "false"` because the guard is a standalone script over
      # node: and Bun builtins — it imports nothing from node_modules, so an
      # install here would be several minutes spent on nothing.
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - name: Reconcile the committed graph with moon
        run: bun run graph:check --query
  # capability:end moon_affected_selection

  # capability:start playwright
  browser:
    name: Launch baked browser payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare browser-enabled project
        shell: bash
        run: |
          set -euo pipefail
          project="$PWD"
          if [ -f template-parameters.toml ]; then
            bun run template:fixtures "${RUNNER_TEMP}/template-fixtures"
            project="${RUNNER_TEMP}/template-fixtures/full"
            cd "$project"
            bash "${GITHUB_WORKSPACE}/scripts/ci/bun-install-retry.sh"
          fi
          printf '%s\n' "$project" > "${RUNNER_TEMP}/browser-project"

      - name: Build and launch browser profile
        shell: bash
        run: |
          set -euo pipefail
          project="$(cat "${RUNNER_TEMP}/browser-project")"
          docker build \
            --progress=plain \
            --target development_browser \
            --tag devenv-browser-ci \
            --file "$project/.devcontainer/Dockerfile" \
            "$project"
          docker run --rm \
            --volume "$project:/workspace:ro" \
            --workdir /workspace \
            devenv-browser-ci \
            bun run browser:preflight
  # capability:end playwright

  # THE one required status check. Set this job's display name as the sole
  # required context in branch protection; no other job in this file is
  # individually required, and every real gating job funnels into it via needs.
  #
  # `always()` so the gate ALWAYS reports. A run whose jobs were skipped — a
  # draft pull request, or a lane this project's capabilities removed — must
  # never strand a required check in a pending state that no further push can
  # clear. Because it always reports, "no checks ran" is not reachable.
  #
  # `needs` names EVERY other job in this file. Exclusions are explicit rather
  # than implicit, and inside this workflow there are none.
  # capability:start codex_cloud
  # codex-cloud-smoke.yml is deliberately outside this gate: it is a separate
  # workflow and a real-network lane, so an upstream registry outage must never
  # redden an unrelated pull request. The hermetic contract guard and bootstrap
  # selftest in the `ci` job carry the required signal instead — which is what
  # `[ci] network_smoke_is_required = false` records in template-parameters.toml.
  # capability:end codex_cloud
  #
  # The informational-exclusion list is empty. A job that is allowed to fail
  # without failing the gate has to earn that with a written reason.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - ci
      - image
      - affected
      - project
      # capability:start moon_affected_selection
      - moon-graph
      # capability:end moon_affected_selection
      # capability:start playwright
      - browser
      # capability:end playwright

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify no required job failed
        # The verdict is derived from `join(needs.*.result)` rather than a
        # hand-maintained list, so a new job cannot be forgotten here — only in
        # `needs`, which the workflow guard checks separately.
        #
        # Both values arrive through `env:` and never through interpolation.
        # Pull-request metadata is attacker-influenced text; interpolated into a
        # `run:` body it would be spliced into the script the runner executes.
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: bash scripts/ci/aggregate-gate.sh
