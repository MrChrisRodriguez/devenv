name: Codex cloud smoke

# Real, networked proof that the committed cloud contract still bootstraps a
# clean Linux host. It is deliberately not part of the required gate: an
# upstream registry outage must not block unrelated pull requests. The hermetic
# guard and selftest in ci.yml carry the required signal.

on:
  pull_request:
    # No `branches:` filter, for the same reason ci.yml has none: that filter
    # matches the PR's BASE branch, so it would silently disable this smoke on
    # every stacked pull request. `paths:` is the intended narrowing.
    #
    # `ready_for_review` keeps this lane consistent with the gating workflow: a
    # PR promoted out of draft revalidates immediately.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".codex/cloud/**"
      - ".prototools"
      - ".devcontainer/proto-checksums.txt"
      - ".devcontainer/install-proto.sh"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/codex-cloud-smoke.yml"
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

# Same draft/ready lane separation as the gating workflow, so a ready_for_review
# run never cancels the draft run whose jobs are still attached to this head.
concurrency:
  group: codex-cloud-smoke-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

permissions:
  contents: read

# Same one-way Bun authority as ci.yml: .prototools -> env.BUN_VERSION -> the
# setup-bun action's required input -> a runtime assertion back against
# .prototools. A literal version anywhere in this file is a second authority.
env:
  BUN_VERSION: "1.3.13"

jobs:
  smoke:
    name: Cloud smoke (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        profile:
          - core
          # capability:start playwright
          - browser
          # capability:end playwright

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The bootstrap under test installs its own workspace dependencies; this
      # job needs nothing from the Bun toolchain but the binary itself.
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - name: Cache cloud toolchain and downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.proto
            ~/.bun/install/cache
            ~/.cache/uv
            ~/.local/share/uv/tools
            ~/.local/bin
            ~/.payloads/browser
          key: codex-cloud-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${{ hashFiles('.codex/cloud/**', '.prototools', 'bun.lock') }}
          restore-keys: |
            codex-cloud-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-

      - name: Run real bootstrap
        run: bash .codex/cloud/bootstrap.sh "${{ matrix.profile }}"

      - name: Verify prepared environment in a fresh shell
        run: env -u CODEX_CLOUD -u CODEX_CLOUD_PROFILE bash .codex/cloud/doctor.sh
